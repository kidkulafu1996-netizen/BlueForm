:root{--floor:#1C2127;--mat:#252B33;--rack:#2F3640;--line:#38404B;--chalk:#EEECE7;--dust:#96A0AB;--y:#F2C230;--r:#E0443A;--b:#2F7BE0;--g:#2FAE5A;--w:#D9DCE0;--steel:#8C96A3;
--disp:"Stamp","Arial Narrow","Roboto Condensed",sans-serif;--body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--hd:calc(54px + env(safe-area-inset-top))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--floor);color:var(--chalk);font:15px/1.5 var(--body)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));background-image:radial-gradient(rgba(255,255,255,.028) 1px,transparent 1.6px),radial-gradient(rgba(255,255,255,.02) 1px,transparent 1.6px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px}
body.active{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
body.active.resting{padding-bottom:calc(215px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
header{position:sticky;top:0;z-index:7;background:rgba(28,33,39,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);height:var(--hd)}
header h1{font:700 25px/1 var(--disp);margin:0;letter-spacing:.2px}
main{padding:16px 14px 24px;max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#171B20;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{position:relative;flex:1;background:none;border:0;color:var(--dust);padding:10px 0 8px;font:600 11px/1 var(--body);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
nav button.on{color:var(--chalk)}
nav button.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--y)}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon{background:none;border:0;color:var(--dust);font-size:20px;padding:6px 8px;cursor:pointer;line-height:1;border-radius:8px}
.card{background:var(--mat);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ct{font:700 19px/1.15 var(--disp);letter-spacing:.2px}
.mute{color:var(--dust)}.sm{font-size:13px}
.sec{font:700 18px/1.2 var(--disp);color:var(--chalk);margin:26px 2px 10px}
.btn{background:var(--rack);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font:700 16px/1.1 var(--disp);letter-spacing:.3px;color:var(--chalk)}
.btn.pri,.btn.okb{background:var(--y);border-color:var(--y);color:#1C2127}
.btn.pri:active,.btn.okb:active{filter:brightness(.92)}
.btn.danger{color:#F27D74}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:8px 12px;font-size:15px}
.btn.wide{width:100%;margin-top:12px;padding:14px;font-size:18px}
.btn.dash{background:none;border:1.5px dashed var(--line);color:var(--dust)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--rack);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:600 13px/1.2 var(--body);cursor:pointer}
.chip.on{background:var(--chalk);color:#1C2127;border-color:var(--chalk)}
/* hero */
.hero{background:var(--mat);border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px;position:relative;overflow:hidden}
.hello{color:var(--dust);font-size:14px}
.load{font:700 30px/1.05 var(--disp);margin:2px 0 14px;letter-spacing:.2px}
.bb{display:block;width:100%;height:auto;margin:6px 0 4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{font-size:11px;color:var(--dust)}
.week i{display:block;width:28px;height:28px;margin:5px auto 0;border-radius:50%;border:1.5px dashed var(--line)}
.week i.on{border:0}
.week .today{color:var(--chalk);font-weight:700}
/* workout */
.wbar{position:sticky;top:var(--hd);z-index:6;background:rgba(28,33,39,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:-16px -14px 14px;padding:12px 14px 12px;border-bottom:1px solid var(--line)}
.wtop{display:flex;align-items:baseline;gap:10px}
.title{flex:1;background:none;border:0;font:700 26px/1.1 var(--disp);padding:0;min-width:0;color:var(--chalk)}
.title:focus{outline:none;box-shadow:0 2px 0 var(--y)}
.wmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--dust);margin-top:8px}
.segs{display:flex;gap:3px;margin-top:8px}
.segs i{flex:1;height:6px;border-radius:2px;background:var(--rack)}
.segs i.on{background:var(--g)}
.exc{border-left:4px solid var(--gc,var(--steel));padding-left:12px}
.exh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:0;color:var(--chalk);font:700 21px/1.15 var(--disp);padding:0;text-align:left;cursor:pointer;letter-spacing:.2px}
.link::after{content:" ⓘ";font:400 13px var(--body);color:var(--dust)}
.last{font-size:13px;color:var(--dust);margin-top:3px}
.sets{margin-top:10px}
.sr{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center;padding:3px 0}
.sr.hd{font-size:12px;color:var(--dust);padding-bottom:2px}
.sr.hd span{text-align:center}
.sr .n{text-align:center;color:var(--dust);font:700 18px var(--disp)}
.sr input{width:100%;background:var(--rack);border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center;font:700 20px/1.1 var(--disp);color:var(--chalk);transition:background .2s,border-color .2s}
.sr input::placeholder{color:#6F7883}
.sr input:focus{outline:none;border-color:var(--y)}
.chk{height:42px;border-radius:9px;border:1.5px solid var(--line);background:none;color:var(--dust);font-size:18px;cursor:pointer;transition:background .2s}
.sr.done input{background:rgba(47,174,90,.14);border-color:rgba(47,174,90,.45)}
.sr.done .chk{background:var(--g);border-color:var(--g);color:#0E2416}
.sr.done .n{color:var(--g)}
.dock{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:8;padding:12px 14px 10px;background:linear-gradient(rgba(28,33,39,0),var(--floor) 35%)}
.dock .btn{display:block;width:100%;max-width:612px;margin:0 auto;padding:15px;font-size:19px}
/* misc */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--mat);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.stat b{display:block;font:700 30px/1 var(--disp)}
.stat span{font-size:12px;color:var(--dust)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--rack);color:var(--dust);white-space:nowrap}
.search{width:100%;background:var(--mat);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--chalk)}
.search:focus{outline:none;border-color:var(--y)}
.seg{display:flex;background:var(--mat);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;background:none;border:0;padding:9px;border-radius:9px;color:var(--dust);font:700 16px var(--disp);cursor:pointer}
.seg button.on{background:var(--chalk);color:#1C2127}
ul.g,ol.g{margin:8px 0 0;padding-left:20px}
ul.g li,ol.g li{margin:6px 0}
ol.g li::marker{font-family:var(--disp);color:var(--y)}
.bar{height:8px;background:var(--rack);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:3px}
select{width:100%;background:var(--mat);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--chalk)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:8px 2px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t td:last-child{text-align:right;font:700 16px var(--disp);white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px;flex:none}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(10,12,15,.6);z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--mat);border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s;visibility:hidden;max-width:640px;margin:0 auto}
#sheet.open{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
#sheet .grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:4px auto 14px}
#sheet h2{margin:0 0 4px;font:700 26px/1.1 var(--disp)}
#sheet .card{background:var(--floor)}
/* rest timer */
#rest{position:fixed;left:14px;right:14px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:10;background:var(--chalk);color:#1C2127;padding:9px 12px;display:none;align-items:center;gap:8px;overflow:hidden;border-radius:12px;max-width:612px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#rest.show{display:flex}
#rest.fin{background:var(--g)}
#rest .tm{font:700 30px/1 var(--disp);font-variant-numeric:tabular-nums;min-width:70px}
#rest #restLbl{font:600 13px var(--body);flex:1}
#rest .btn{background:rgba(28,33,39,.12);border-color:rgba(28,33,39,.2);color:#1C2127}
#rest #restBar{position:absolute;left:0;bottom:0;height:3px;background:#1C2127;opacity:.45}
#toast{position:fixed;left:50%;top:calc(var(--hd) + 10px);transform:translateX(-50%);background:var(--chalk);color:#1C2127;font-weight:600;padding:9px 16px;border-radius:10px;z-index:30;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.warnbox{background:#3a2d16;border:1px solid #6b5124;color:#f3d39b;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
textarea{width:100%;min-height:120px;background:var(--floor);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;color:var(--chalk)}
.pr{color:var(--y);font:700 18px var(--disp)}
svg.chart text{fill:var(--dust);font-size:11px}
svg.chart{display:block;margin-top:6px}
.tip{font-size:13.5px;color:var(--chalk);background:rgba(242,194,48,.08);border-left:3px solid var(--y);border-radius:4px 9px 9px 4px;padding:8px 11px;margin-top:10px;line-height:1.45}
.recbox{background:var(--floor);border:1px solid var(--line);border-left:4px solid var(--y);border-radius:12px;padding:12px 14px;margin-top:14px}
.recbox b{font:700 20px var(--disp)}
.recbox p{margin:6px 0;font-size:14px}
.pe{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.pen{flex:1;min-width:0;font-size:14px}
.pei{display:flex;align-items:center;gap:4px;flex:none}
.pei input{width:42px;background:var(--rack);border:1px solid var(--line);border-radius:7px;padding:6px 2px;text-align:center;font:700 17px var(--disp);color:var(--chalk)}
.pei .icon{font-size:15px;padding:4px 5px}
.lbl{font-size:13px;color:var(--dust);margin-top:14px;font-weight:600}
.demo{background:var(--floor);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:12px}
a.btn{display:block;text-align:center;text-decoration:none}
.daypills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.daypill{display:flex;align-items:center;gap:7px;background:var(--rack);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:700 15px var(--disp);cursor:pointer}
.mix{display:flex;gap:2px}
.mix i{width:5px;height:14px;border-radius:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:10px}
.cal .dh{font-size:11px;color:var(--dust);padding-bottom:4px}
.cal .d{height:42px;border-radius:9px;font:700 15px/1 var(--disp);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dust)}
.cal .d.has{color:var(--chalk);background:var(--rack)}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--y)}
.cal .d .pd{display:flex;gap:2px;height:5px}
.cal .d .pd i{width:5px;height:5px;border-radius:50%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
"use strict";
/* ---------- Exercise library ---------- */
const EX=[
{id:'bench',n:'Barbell Bench Press',g:'Chest',m:'Chest, front delts, triceps',e:'Barbell',s:['Lie with your eyes under the bar, feet flat, shoulder blades pulled together and down.','Grip a little wider than shoulder width and unrack with straight arms.','Lower under control to your mid-chest, elbows roughly 45–70° from your sides.','Press up and slightly back to the start without lifting your hips.'],t:['Use safety pins or a spotter when going heavy.','Keep wrists stacked directly over elbows.']},
{id:'incline_db',n:'Incline Dumbbell Press',g:'Chest',m:'Upper chest, front delts, triceps',e:'Dumbbells',s:['Set the bench to about 30°.','Start with dumbbells at chest level, palms forward or slightly turned in.','Press up until arms are straight, bringing the bells close together at the top.','Lower slowly until you feel a stretch across the chest.'],t:['A lower angle keeps more work on the chest and less on the shoulders.']},
{id:'pushup',n:'Push-up',g:'Chest',m:'Chest, triceps, core',e:'Bodyweight',s:['Hands just wider than shoulders, body in one straight line from head to heels.','Lower until your chest is a fist’s height from the floor.','Push the floor away to return, keeping hips in line.'],t:['Too hard? Elevate your hands on a bench. Too easy? Elevate your feet or add a pause.']},
{id:'cable_fly',n:'Cable Fly',g:'Chest',m:'Chest',e:'Cable',s:['Set pulleys around shoulder height and step forward into a split stance.','With a soft bend in the elbows, sweep the handles together in front of your chest.','Return slowly until you feel a stretch, keeping the elbow angle fixed.'],t:['Think “hug a barrel”, not “press”.']},
{id:'dips',n:'Dips',g:'Chest',m:'Chest, triceps, front delts',e:'Dip bars',s:['Support yourself on straight arms, shoulders down away from your ears.','Lean slightly forward and lower until upper arms are about parallel to the floor.','Press back up to straight arms.'],t:['Use an assisted machine or a band until you can do 8 clean reps.','Stop short if you feel pain at the front of the shoulder.']},
{id:'deadlift',n:'Deadlift',g:'Back',m:'Glutes, hamstrings, back, grip',e:'Barbell',s:['Stand with mid-foot under the bar, feet hip-width apart.','Hinge down and grip just outside your legs; shins touch the bar.','Brace your core, flatten your back and pull the slack out of the bar.','Drive through the floor, keeping the bar against your legs, and stand tall.','Lower by pushing hips back first, then bend the knees once the bar passes them.'],t:['Your back should stay neutral—never rounded—throughout.','Reset each rep from the floor while learning.']},
{id:'row',n:'Barbell Row',g:'Back',m:'Upper back, lats, biceps',e:'Barbell',s:['Hinge forward to roughly 45°, knees soft, back flat.','Pull the bar to your lower ribs, driving elbows back.','Pause briefly, then lower with control.'],t:['If your torso swings up, the weight is too heavy.']},
{id:'pullup',n:'Pull-up',g:'Back',m:'Lats, upper back, biceps',e:'Pull-up bar',s:['Hang with hands just wider than shoulders, palms facing away.','Pull your shoulder blades down, then pull until your chin clears the bar.','Lower all the way to straight arms under control.'],t:['Use a band or assisted machine, or do slow negatives, to build up.','Log added weight as kg; use 0 for bodyweight.']},
{id:'lat_pd',n:'Lat Pulldown',g:'Back',m:'Lats, upper back, biceps',e:'Cable machine',s:['Lock your thighs under the pad and grip the bar wider than shoulders.','Lean back slightly and pull the bar to your upper chest.','Let it rise slowly until your arms are straight.'],t:['Lead with the elbows; avoid yanking with your lower back.']},
{id:'cable_row',n:'Seated Cable Row',g:'Back',m:'Mid back, lats, biceps',e:'Cable machine',s:['Sit tall with a slight knee bend, arms extended.','Row the handle to your stomach, squeezing shoulder blades together.','Return slowly, letting the shoulders reach forward a little.'],t:['Keep your torso mostly still.']},
{id:'db_row',n:'One-arm Dumbbell Row',g:'Back',m:'Lats, upper back',e:'Dumbbell + bench',s:['Place one hand and knee on a bench, back flat.','Pull the dumbbell toward your hip.','Lower until the arm is straight and the shoulder stretches.'],t:['Do all reps on one side, then switch.']},
{id:'squat',n:'Back Squat',g:'Legs',m:'Quads, glutes, adductors',e:'Barbell + rack',s:['Set the bar on your upper back, hands just outside shoulders.','Feet about shoulder width, toes slightly out; brace your core.','Sit down and back, knees tracking over toes, to at least parallel if mobility allows.','Drive up through the whole foot, keeping your chest up.'],t:['Always set the rack safeties just below your bottom position.','Knees moving forward over the toes is normal.']},
{id:'rdl',n:'Romanian Deadlift',g:'Legs',m:'Hamstrings, glutes',e:'Barbell or dumbbells',s:['Stand tall holding the weight, knees softly bent.','Push your hips back, sliding the weight down your thighs with a flat back.','Stop when you feel a strong hamstring stretch (usually mid-shin).','Squeeze glutes and drive hips forward to stand.'],t:['It is a hip hinge, not a squat—knees barely change angle.']},
{id:'leg_press',n:'Leg Press',g:'Legs',m:'Quads, glutes',e:'Machine',s:['Feet shoulder-width on the middle of the platform.','Release the safeties and lower until knees reach about 90° or a bit deeper.','Press back up without fully locking your knees.'],t:['Keep your lower back pressed into the pad.']},
{id:'lunge',n:'Walking Lunge',g:'Legs',m:'Quads, glutes',e:'Dumbbells',s:['Step forward and lower until both knees are near 90°.','Push through the front heel and step into the next lunge.','Count reps per leg.'],t:['Take a long enough step that your front heel stays down.']},
{id:'leg_curl',n:'Leg Curl',g:'Legs',m:'Hamstrings',e:'Machine',s:['Align your knee with the machine pivot.','Curl the pad toward your glutes.','Lower slowly to full extension.'],t:['Slow negatives (3 sec) make this far more effective.']},
{id:'leg_ext',n:'Leg Extension',g:'Legs',m:'Quads',e:'Machine',s:['Sit with knees in line with the pivot, pad on lower shins.','Extend until legs are straight and squeeze.','Lower under control.'],t:['Hold the handles to stay planted.']},
{id:'calf',n:'Standing Calf Raise',g:'Legs',m:'Calves',e:'Machine or step',s:['Balls of feet on the edge, heels hanging.','Lower to a deep stretch and pause.','Rise as high as possible onto your toes and pause.'],t:['Pauses at both ends beat bouncing.']},
{id:'hip_thrust',n:'Hip Thrust',g:'Legs',m:'Glutes',e:'Barbell + bench',s:['Upper back on a bench, bar padded across your hips.','Feet flat, shins vertical at the top.','Drive hips up until your body is flat from shoulders to knees; squeeze glutes.','Lower with control.'],t:['Keep your chin tucked and ribs down—don’t arch your lower back.']},
{id:'ohp',n:'Overhead Press',g:'Shoulders',m:'Front & side delts, triceps',e:'Barbell',s:['Bar at the front of your shoulders, grip just outside them.','Squeeze glutes and brace; move your head back slightly.','Press straight up, then bring your head through once the bar passes your face.','Lower back to the shoulders under control.'],t:['Don’t lean back excessively—that turns it into an incline press.']},
{id:'db_lat',n:'Lateral Raise',g:'Shoulders',m:'Side delts',e:'Dumbbells',s:['Stand holding light dumbbells at your sides.','Raise them out to the side to shoulder height, leading with the elbows.','Lower slowly.'],t:['Go light—strict form beats heavy swinging.']},
{id:'face_pull',n:'Face Pull',g:'Shoulders',m:'Rear delts, upper back',e:'Cable + rope',s:['Set the rope at face height.','Pull toward your face, elbows high, hands finishing beside your ears.','Return slowly.'],t:['Great for shoulder health; do them often.']},
{id:'rear_fly',n:'Reverse Fly',g:'Shoulders',m:'Rear delts',e:'Dumbbells or machine',s:['Hinge forward (or face the pec-deck pad).','Sweep arms out to the sides with a soft elbow bend.','Lower with control.'],t:['Use light weight and feel the back of the shoulder.']},
{id:'curl',n:'Barbell Curl',g:'Arms',m:'Biceps',e:'Barbell or EZ bar',s:['Stand tall, shoulder-width grip, palms up.','Curl the bar up keeping elbows by your sides.','Lower all the way under control.'],t:['No swinging—if you need momentum, reduce the weight.']},
{id:'hammer',n:'Hammer Curl',g:'Arms',m:'Biceps, forearms',e:'Dumbbells',s:['Hold dumbbells with palms facing each other.','Curl up without rotating the wrists.','Lower slowly.'],t:['Alternate arms or do both together.']},
{id:'tri_pd',n:'Triceps Pushdown',g:'Arms',m:'Triceps',e:'Cable',s:['Elbows pinned to your sides, hands on the bar or rope.','Push down until arms are straight; squeeze.','Let it come up until forearms are just past parallel.'],t:['Only your forearms should move.']},
{id:'oh_ext',n:'Overhead Triceps Extension',g:'Arms',m:'Triceps (long head)',e:'Dumbbell or cable',s:['Hold the weight overhead with both hands.','Lower behind your head by bending only at the elbows.','Extend back to straight arms.'],t:['Keep elbows pointing forward, not flared.']},
{id:'plank',n:'Plank',g:'Core',m:'Core',e:'Bodyweight',time:1,s:['Forearms under shoulders, body straight from head to heels.','Squeeze glutes and brace like you’re about to be poked in the stomach.','Hold, breathing steadily.'],t:['Log the hold time in seconds.','Quality over length—stop when your hips sag.']},
{id:'hang_leg',n:'Hanging Leg Raise',g:'Core',m:'Abs, hip flexors',e:'Pull-up bar',s:['Hang from a bar, shoulders engaged.','Raise your legs (bent or straight) by curling your pelvis up.','Lower slowly without swinging.'],t:['Start with bent knees if straight legs are too hard.']},
{id:'cable_crunch',n:'Cable Crunch',g:'Core',m:'Abs',e:'Cable + rope',s:['Kneel facing the cable, rope beside your head.','Crunch down by curling your ribs toward your hips.','Return slowly to a stretch.'],t:['Hips stay still; the movement is in your spine.']}
,{id:'incline_bench',n:'Incline Barbell Bench Press',g:'Chest',m:'Upper chest, front delts, triceps',e:'Barbell + incline bench',s:['Set the bench to 30–45° and lie with your eyes under the bar, shoulder blades pulled back and down.','Unrack with straight arms, grip slightly wider than shoulder width.','Lower to your upper chest, just below the collarbones, elbows about 60° from your sides.','Press up and slightly back until the bar is over your shoulders.'],t:['A lower angle (about 30°) keeps more work on the chest and less on the shoulders.','Set the safeties or use a spotter.']}
,{id:'db_bench',n:'Dumbbell Bench Press',g:'Chest',m:'Chest, front delts, triceps',e:'Dumbbells + flat bench',s:['Sit with the dumbbells on your thighs, then lie back and bring them to chest level.','Squeeze your shoulder blades together and keep your feet flat.','Lower until the dumbbells are level with your chest, elbows about 45–60° from your sides.','Press up, bringing the dumbbells close together without clanking them.'],t:['Dumbbells give a deeper stretch than a barbell.','To finish, bring the dumbbells to your thighs as you sit up.']}
,{id:'pec_deck',n:'Pec Deck (Machine Fly)',g:'Chest',m:'Chest',e:'Machine',s:['Adjust the seat so your upper arms are level with your shoulders; place your forearms on the pads (or grip the handles) with elbows bent about 90°.','Sit tall with your chest up and shoulders back.','Bring the handles together in front of you and squeeze your chest.','Return slowly until you feel a stretch across the chest, without bouncing.'],t:['Keep your shoulders from rolling forward at the end.']}
,{id:'rev_pec',n:'Reverse Pec Deck',g:'Shoulders',m:'Rear delts, upper back',e:'Machine',s:['Sit facing the machine with your chest against the pad, and set the handles so your arms reach them straight out in front at shoulder height.','Grip the handles, palms facing in or down, with a soft bend in your elbows.','Sweep your arms out and back until they line up with your body, and pause.','Return slowly until your hands are back in front of you.'],t:['Use a palms-down (pronated) grip to put more of the work on the rear delts (Deltabolic’s cue).','Lead with your elbows and don’t shrug your shoulders up.','Use light weight; the rear shoulders are small muscles.']}
,{id:'low_cable_fly',n:'Low-to-High Cable Fly',g:'Chest',m:'Upper chest, front delts',e:'Cable',s:['Set both pulleys to the lowest position and step forward into a split stance.','Start with your arms down by your sides, slightly forward, palms facing ahead.','Sweep the handles up and together to chin height with soft elbows.','Lower slowly along the same arc.'],t:['Think of scooping upward, not pressing.']}
,{id:'machine_press',n:'Chest Press Machine',g:'Chest',m:'Chest, front delts, triceps',e:'Machine',s:['Set the seat so the handles line up with your mid-chest.','Keep your back flat on the pad and shoulder blades pulled back.','Press until your arms are almost straight.','Return slowly until you feel a stretch in your chest.'],t:['A machine lets you push close to failure safely, with no spotter.']}
,{id:'chinup',n:'Chin-up',g:'Back',m:'Lats, biceps, upper back',e:'Pull-up bar',s:['Hang with an underhand grip at shoulder width, arms fully straight.','Pull your shoulders down first, then pull until your chin clears the bar.','Lower all the way to straight arms under control.'],t:['Works the biceps more than an overhand pull-up.','Use a band or the assisted machine if needed.']}
,{id:'cs_row',n:'Chest-Supported Row',g:'Back',m:'Mid back, lats, rear delts',e:'Dumbbells + incline bench, or machine',s:['Lie chest-down on a bench set to 30–45°, dumbbells hanging straight down.','Row your elbows back toward your hips and squeeze your shoulder blades together.','Lower until your arms are straight and your shoulders stretch forward.'],t:['The bench takes your lower back out of it, so you can row strictly.']}
,{id:'straight_pd',n:'Straight-Arm Pulldown',g:'Back',m:'Lats',e:'Cable + bar or rope',s:['Face a high pulley and hinge forward slightly with your arms almost straight in front of you.','Sweep the bar down in an arc to your thighs, using your lats.','Let it rise slowly until you feel a stretch under your arms.'],t:['Keep the elbow bend fixed; it should not turn into a triceps pushdown.']}
,{id:'shrug',n:'Dumbbell Shrug',g:'Back',m:'Upper traps',e:'Dumbbells',s:['Stand tall holding heavy dumbbells at your sides.','Lift your shoulders straight up toward your ears and pause for 1 second.','Lower to a full stretch.'],t:['Go straight up and down; don’t roll your shoulders.','Keep your arms straight.']}
,{id:'db_ohp',n:'Seated Dumbbell Shoulder Press',g:'Shoulders',m:'Front & side delts, triceps',e:'Dumbbells + upright bench',s:['Sit on an upright bench with the dumbbells at shoulder height, palms forward, elbows slightly in front of you.','Press up until your arms are straight and the dumbbells are over your head.','Lower to about ear level under control.'],t:['Keep your back on the pad and your ribs down; don’t arch.']}
,{id:'cable_lat',n:'Cable Lateral Raise',g:'Shoulders',m:'Side delts',e:'Cable',s:['Set a pulley to the lowest position and stand side-on to it.','Hold the handle in your far hand, across the front of your body.','Raise your arm out to the side to shoulder height, leading with the elbow.','Lower slowly back across your body.'],t:['The cable keeps tension at the bottom, where dumbbells go slack.','Use light weight with strict form.']}
,{id:'incline_curl',n:'Incline Dumbbell Curl',g:'Arms',m:'Biceps (long head)',e:'Dumbbells + incline bench',s:['Set the bench to 45–60° and sit back with your arms hanging straight down behind your body.','Curl with your palms up, keeping your upper arms still.','Lower all the way until your arms are fully straight.'],t:['The stretched bottom position is the point; use less weight than a standing curl.']}
,{id:'preacher',n:'Preacher Curl',g:'Arms',m:'Biceps, brachialis',e:'EZ bar or dumbbell + preacher bench',s:['Rest your upper arms flat on the pad, armpits snug against the top.','Curl until your forearms are just short of vertical.','Lower over 2–3 seconds to almost straight; don’t bounce at the bottom.'],t:['The bottom of the curl strains the elbow most, so keep it controlled.']}
,{id:'machine_preacher',n:'Machine Preacher Curl',g:'Arms',m:'Biceps, brachialis',e:'Preacher curl machine',s:['Set the seat so your armpits sit snug on top of the pad and your elbows line up with the machine’s pivot point.','Grip the handles with palms up, upper arms flat on the pad.','Curl until your forearms are just short of vertical and squeeze for 1 second.','Lower over 2–3 seconds to almost straight arms, without letting the weight stack touch down.'],t:['The machine keeps tension even at the bottom, where free-weight preachers get easy.','Keep your elbows on the pad; don’t lift your shoulders or lean back to finish a rep.']}
,{id:'bayesian',n:'Bayesian Cable Curl',g:'Arms',m:'Biceps (long head)',e:'Cable + D-handle',s:['Set the pulley to the lowest position and face away from it in a split stance.','Step forward until your arm is pulled slightly behind your body.','Keep your elbow pinned back and curl, palm up.','Return until your arm is fully straight behind you.'],t:['Don’t let your shoulder roll forward.','Train one arm at a time.']}
,{id:'cable_curl',n:'Cable Bar Curl',g:'Arms',m:'Biceps',e:'Cable + straight or EZ bar',s:['Set the pulley to the lowest position and stand a step back, elbows at your sides.','Curl the bar up and squeeze for 1 second.','Lower over 3 seconds to fully straight arms.'],t:['No swaying or leaning back.']}
,{id:'rope_hammer',n:'Rope Hammer Curl',g:'Arms',m:'Brachialis, forearms, biceps',e:'Cable + rope',s:['Use the low pulley with a rope, palms facing each other.','Curl up, pulling the rope ends slightly apart at the top.','Lower slowly with your elbows still.'],t:['Keep your wrists straight.']}
,{id:'conc_curl',n:'Concentration Curl',g:'Arms',m:'Biceps',e:'Dumbbell + bench',s:['Sit, lean forward and brace the back of your upper arm against your inner thigh.','Curl the dumbbell toward your shoulder and squeeze for 1 second.','Lower until your arm is straight.'],t:['Showed the highest biceps activation in EMG tests.']}
,{id:'rope_pd',n:'Rope Pushdown',g:'Arms',m:'Triceps (lateral head)',e:'Cable + rope',s:['Set a rope on the high pulley and pin your elbows to your sides.','Push down and spread the rope ends apart at the bottom.','Return until your forearms are just past parallel to the floor.'],t:['Only your forearms should move.']}
,{id:'skull',n:'EZ-Bar Skull Crusher',g:'Arms',m:'Triceps (long head)',e:'EZ bar + flat bench',s:['Lie on the bench with the bar over your shoulders, arms straight and angled slightly back.','Bend only at the elbows to lower the bar toward the top of your head.','Extend back up without letting your elbows flare out.'],t:['Go light and controlled; elbows point at the ceiling.']}
,{id:'cg_bench',n:'Close-Grip Bench Press',g:'Arms',m:'Triceps, chest',e:'Barbell + flat bench',s:['Grip the bar just inside shoulder width.','Lower to your lower chest with your elbows tucked about 30–45° from your sides.','Press back up to straight arms.'],t:['Don’t grip too narrow; it strains the wrists.']}
,{id:'cable_oh_ext',n:'Cable Overhead Extension',g:'Arms',m:'Triceps (long head)',e:'Cable + rope',s:['Set a rope on a low or mid pulley, face away, and hold the rope behind your head, elbows by your ears.','Extend forward and up until your arms are straight.','Return slowly to a deep stretch behind your head.'],t:['Keep your elbows pointing forward, not flaring out.']}

let S={units:'kg',rest:90,workouts:[],active:null,custom:[]};

try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));localStorage.setItem(KEY+'.t','1');}catch(e){storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
function defaultPrograms(){return TEMPLATES.map(t=>({id:t.id,builtin:t.id,name:t.name,desc:t.desc,days:t.days.map(d=>Object.assign({name:d.name,items:d.items.map(([id,s,r])=>({id,s,r}))},d.rest?{rest:1}:{}))}))}
function fixState(){if(!Array.isArray(S.programs)){S.programs=defaultPrograms();S.seen=TEMPLATES.map(t=>t.id)}if(!Array.isArray(S.seen))S.seen=['fb','ul','ppl'];defaultPrograms().forEach(d=>{if(!S.seen.includes(d.builtin)){S.programs.unshift(d);S.seen.push(d.builtin)}});if(!S.prefs)S.prefs={days:3,exp:'new',goal:'muscle'};if(!Array.isArray(S.custom))S.custom=[];if(S.splitV!==3){const i=S.programs.findIndex(x=>x.builtin==='split5');if(i>=0){const d=defaultPrograms().find(x=>x.id==='split5');d.id=S.programs[i].id;S.programs[i]=d}S.splitV=3}}

const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=Object.fromEntries(EX.map(x=>[x.id,x]));
function exObj(id){return byId[id]||S.custom.find(c=>c.id===id)||{id,n:id,g:'Custom'}}
const exName=id=>exObj(id).n;
const isTime=id=>!!exObj(id).time;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const fmtN=n=>(Math.round(n*10)/10).toLocaleString();
const e1rm=(w,r)=>r>0?(r===1?w:w*(1+r/30)):0;
function fmtDur(ms){const m=Math.floor(ms/60000);const hh=Math.floor(m/60);return hh?`${hh}h ${m%60}m`:`${m} min`}
function fmtClock(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function fmtDate(t){return new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6);return d.getTime()}
function volume(w){let v=0;w.ex.forEach(x=>{if(!isTime(x.id))x.sets.forEach(s=>v+=s.w*s.r)});return v}
const tu=id=>exObj(id).u==='min'?' min':'s';
function setStr(id,s){return isTime(id)?`${s.r}${tu(id)}`:(s.w?`${fmtN(s.w)}×${s.r}`:`${s.r} reps`)}
function lastSession(id){
 const ws=S.workouts.slice().sort((a,b)=>b.date-a.date);
 for(const w of ws){const x=w.ex.find(e=>e.id===id);if(x&&x.sets.length)return x}
 return null}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}

 <text x="${L}" y="${H-6}">${ds(t0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${ds(t1)}</text></svg>`}

 p.days.forEach((d,di)=>{
  o+=`<div class="card" style="margin-top:10px;background:#12151b"><div class="exh" style="gap:8px"><input class="search" data-f="dname" data-di="${di}" value="${h(d.name)}" style="padding:8px 10px" aria-label="Day name"><button class="icon" data-a="dayDel" data-di="${di}" aria-label="Delete day">🗑</button></div>`;
  d.items.forEach((it,ii)=>{o+=`<div class="pe"><div class="pen">${h(exName(it.id))}</div><div class="pei"><input inputmode="numeric" data-f="is" data-di="${di}" data-ii="${ii}" value="${it.s}" aria-label="Sets"><span class="mute">×</span><input inputmode="numeric" data-f="ir" data-di="${di}" data-ii="${ii}" value="${it.r}" aria-label="${isTime(it.id)?'Seconds':'Reps'}"><span class="mute sm" style="width:18px">${isTime(it.id)?tu(it.id).trim():''}</span>${ii>0?`<button class="icon" data-a="itUp" data-di="${di}" data-ii="${ii}" aria-label="Move up">↑</button>`:'<span style="width:25px"></span>'}<button class="icon" data-a="itDel" data-di="${di}" data-ii="${ii}" aria-label="Remove">✕</button></div></div>`});
  if(!d.items.length)o+=`<div class="mute sm" style="padding:8px 0">No exercises yet.</div>`;
  o+=`<button class="btn sm" data-a="itAdd" data-di="${di}" style="margin-top:10px">+ Exercise</button></div>`});
 o+=`<button class="btn wide" data-a="dayAdd">+ Add day</button>
 <div class="row"><button class="btn pri" style="flex:1" data-a="progSave">Save</button><button class="btn" style="flex:1" data-a="closeSheet">Cancel</button></div>
 ${p._new?'':`<div class="row"><button class="btn sm" data-a="progDup">Duplicate</button><button class="btn sm danger" data-a="progDel">Delete program</button></div>`}`;
 openSheet(o);if(keepScroll!==undefined)$('#sheet').scrollTop=keepScroll===true?sc:keepScroll}
function openPicker(){
 UI.pq='';openSheet(`${UI.pickMode?`<button class="btn sm" data-a="pickBack" style="margin-bottom:8px">← Back to program</button>`:''}<h2>Add exercise</h2><input class="search" placeholder="Search or type a new name" data-f="pq" style="margin-top:8px"><div class="chips">${GROUPS.map(g=>`<button class="chip ${UI.pgrp===g?'on':''}" data-a="pgrp" data-v="${g}">${g}</button>`).join('')}</div><div id="plist" style="margin-top:8px">${exList('',UI.pgrp,'pick')}</div>`);$('#sheet').scrollTop=0}
function pickInto(id){
 if(UI.pickMode){UI.edit.days[UI.pickMode.di].items.push({id,s:exObj(id).u==='min'?1:3,r:exObj(id).u==='min'?20:isTime(id)?30:10});const sc=UI.pickMode.sc;UI.pickMode=null;openEditor(sc);toast(exName(id)+' added')}
 else{addEx(id);save();closeSheet();render();toast(exName(id)+' added')}}

/* ---------- Workout actions ---------- */
function newWorkout(name){S.active={id:uid(),name,started:Date.now(),ex:[]}}
function addEx(id,sets,reps){
 const ls=lastSession(id);const n=sets||(ls?ls.sets.length:3);const R=recFor(id,reps);const arr=[];
 for(let i=0;i<n;i++)arr.push({w:'',r:'',d:false,pw:R.w===''?'':String(R.w),pr:String(R.r||'')});
 S.active.ex.push({id,sets:arr,tip:R.msg})}
function startTpl(tid,di){const t=S.programs.find(x=>x.id===tid);if(!t||!t.days[di])return;const d=t.days[di];
 if(d.rest){openSheet(`<h2>Rest day</h2><p class="mute">${h(REST_TXT)}</p><button class="btn pri wide" data-a="restDone" data-t="${h(t.id)}" data-d="${di}">Mark rest day done</button>`);return}
 const go=()=>{newWorkout(`${t.name.split(' (')[0]} – ${d.name}`);S.active.prog={pid:t.id,di};d.items.forEach(it=>addEx(it.id,it.s,it.r));save();UI.tab='log';closeSheet();render();window.scrollTo(0,0)};
 if(S.active)ask('Replace current workout?','You have a workout in progress. Starting a new one discards it.','Start new',go,true);else go()}
function finish(){
 const a=S.active;
 const ex=a.ex.map(x=>({id:x.id,sets:x.sets.filter(s=>s.d).map(s=>({w:num(s.w||s.pw),r:num(s.r||s.pr)})).filter(s=>s.r>0)})).filter(x=>x.sets.length);
 if(!ex.length){ask('Nothing completed','No sets are ticked as done. Tick ✓ next to each set you finished, or discard this workout.','Discard workout',()=>{S.active=null;save();closeSheet();restStop();render()},true);return}
 // PRs
 const prs=[];
 ex.forEach(x=>{if(isTime(x.id))return;let prev=0;S.workouts.forEach(w=>w.ex.forEach(e=>{if(e.id===x.id)e.sets.forEach(s=>{prev=Math.max(prev,e1rm(s.w,s.r))})}));
  const best=Math.max(...x.sets.map(s=>e1rm(s.w,s.r)));if(prev>0&&best>prev)prs.push(`${exName(x.id)}: est. 1RM ${fmtN(best)} ${S.units}`)});
 const w={id:a.id,name:a.name||'Workout',date:a.started,dur:Date.now()-a.started,ex};if(a.prog){w.prog=a.prog;S.lastProg={pid:a.prog.pid,di:a.prog.di}}
 S.workouts.push(w);S.active=null;save();restStop();render();
 const sets=ex.reduce((n,x)=>n+x.sets.length,0);
 openSheet(`<h2>Workout saved</h2><div class="stats" style="margin:12px 0;grid-template-columns:repeat(2,1fr)"><div class="stat"><b style="color:var(--y)">${kcalOf(w)}</b><span>Calories burned (kcal)</span></div><div class="stat"><b>${fmtDur(w.dur).replace(" min","m")}</b><span>Time</span></div><div class="stat"><b>${sets}</b><span>Sets</span></div><div class="stat"><b>${fmtN(volume(w))}</b><span>${S.units} lifted</span></div></div><div class="mute sm">Calories are an estimate from your body weight (${fmtN(S.bw||90)} ${S.units}), session time and the exercises you did. ${S.bw?'':'Set your weight in ⚙︎ Settings for a better estimate.'}</div>${prs.length?`<div class="card"><div class="pr">New personal records</div><ul class="g">${prs.map(p=>`<li>${h(p)}</li>`).join('')}</ul></div>`:''}<button class="btn pri wide" data-a="closeSheet">Done</button>`)}

/* ---------- Rest timer ---------- */
const RT={end:0,iv:null};
function restStart(sec){if(!sec)return;document.body.classList.add('resting');RT.end=Date.now()+sec*1000;RT.total=sec;$('#rest').classList.add('show');$('#rest').classList.remove('fin');$('#restLbl').textContent='Rest';tick()}
function restStop(){RT.end=0;document.body.classList.remove('resting');$('#rest').classList.remove('show','fin')}
function tick(){
 const el=$('#elapsed');if(el&&S.active)el.textContent=fmtDur(Date.now()-S.active.started)+', ~'+activeKcal()+' kcal';
 if(!RT.end)return;const left=(RT.end-Date.now())/1000;
 if(left<=0){if(!$('#rest').classList.contains('fin')){$('#rest').classList.add('fin');$('#restLbl').textContent='Rest done – next set!';$('#restTm').textContent='0:00';try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep();setTimeout(()=>{if(RT.end&&RT.end<=Date.now())restStop()},6000)}return}
 $('#restTm').textContent=fmtClock(left);$('#restBar').style.width=Math.min(100,left/(RT.total||90)*100)+'%'}
setInterval(tick,500);
let AC=null;
function beep(){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.35)}catch(e){}}
function unlockAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}

/* ---------- Settings / backup ---------- */
function settings(){
 openSheet(`<h2>Settings</h2>
 <div class="sec">Weight unit</div><div class="chips">${['kg','lb'].map(u=>`<button class="chip ${S.units===u?'on':''}" data-a="unit" data-v="${u}">${u}</button>`).join('')}</div><div class="mute sm" style="margin-top:6px">Changes the label only; logged numbers aren’t converted.</div>
 <div class="sec">Body weight (for calories)</div><div class="row" style="align-items:center;margin-top:0"><input class="search" style="width:120px" inputmode="decimal" data-f="bw" value="${S.bw||''}" placeholder="90"><span class="mute">${S.units}</span></div>
 <div class="sec">Rest timer after each set</div><div class="chips">${[0,60,90,120,180].map(v=>`<button class="chip ${S.rest===v?'on':''}" data-a="restSet" data-v="${v}">${v?fmtClock(v):'Off'}</button>`).join('')}</div>
 <div class="sec">Install the app</div>${isStandalone()?'<p class="mute sm" style="margin-top:0">Installed. It works fully offline.</p>':(installEvt?'<button class="btn pri" data-a="install">Install on this phone</button>':'<p class="mute sm" style="margin-top:0">iPhone: open in Safari, tap Share, then Add to Home Screen. Android: open in Chrome, tap ⋮, then Install app or Add to Home screen.</p>')}
 <div class="sec">Backup</div><p class="mute sm" style="margin-top:0">Your data lives only in this browser on this device. Export a backup now and then so you don’t lose it.</p>
 <div class="row"><button class="btn" data-a="export">Export backup</button><button class="btn" data-a="copyExport">Copy backup text</button></div>
 <div class="row"><label class="btn" style="display:inline-block">Import backup file<input type="file" accept=".json,application/json,text/plain" data-f="importFile" hidden></label><button class="btn" data-a="pasteImport">Paste backup text</button></div>
 <div class="sec">Danger zone</div><button class="btn danger" data-a="wipe">Delete all data</button>
 <p class="mute sm" style="margin-top:16px">${S.workouts.length} workout${S.workouts.length===1?'':'s'} stored, works fully offline</p>`)}
function backupText(){return JSON.stringify({app:'gymtrack',v:1,exported:new Date().toISOString(),data:S})}
function doImport(txt){
 try{const j=JSON.parse(txt);const d=j.data||j;if(!Array.isArray(d.workouts))throw 0;
  ask('Import backup?',`This replaces what’s on this device with ${d.workouts.length} workouts from the backup.`,'Import',()=>{S=Object.assign({units:'kg',rest:90,workouts:[],active:null,custom:[]},d);fixState();save();closeSheet();render();toast('Backup imported')},true)}
 catch(e){toast('That doesn’t look like a valid backup')}}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
 const nb=e.target.closest('nav button');if(nb){UI.tab=nb.dataset.tab;render();window.scrollTo(0,0);return}
 const el=e.target.closest('[data-a]');if(!el)return;
 const A=el.dataset.a,ei=+el.dataset.ei,si=+el.dataset.si,id=el.dataset.id,v=el.dataset.v;
 switch(A){
 case 'closeSheet':closeSheet();break;
 case 'yes':{const f=pendingYes;pendingYes=null;closeSheet();f&&f();break}
 case 'settings':settings();break;
 case 'startEmpty':newWorkout('Workout');save();render();break;
 case 'startTpl':startTpl(el.dataset.t,+el.dataset.d);break;
 case 'repeat':{const w=S.workouts.find(x=>x.id===id);const go=()=>{newWorkout(w.name);if(w.prog)S.active.prog=w.prog;w.ex.forEach(x=>addEx(x.id,x.sets.length));save();UI.tab='log';closeSheet();render();window.scrollTo(0,0)};if(S.active)ask('Replace current workout?','You have a workout in progress. Starting a new one discards it.','Start new',go,true);else go();break}
 case 'toggleSet':{unlockAudio();const s=S.active.ex[ei].sets[si];s.d=!s.d;if(s.d){if(s.w===''&&s.pw)s.w=s.pw;if(s.r===''&&s.pr)s.r=s.pr;if(!num(s.r)){s.d=false;toast('Enter reps first');render();break}restStart(S.rest)}save();render();break}
 case 'addSet':{const x=S.active.ex[ei];const l=x.sets[x.sets.length-1]||{};x.sets.push({w:'',r:'',d:false,pw:l.w||l.pw||'',pr:l.r||l.pr||''});save();render();break}
 case 'delSet':S.active.ex[ei].sets.pop();save();render();break;
 case 'exMenu':openSheet(`<h2>${h(exName(S.active.ex[ei].id))}</h2><div class="row" style="flex-direction:column"><button class="btn" data-a="exInfo" data-id="${h(S.active.ex[ei].id)}">How to do it</button>${ei>0?`<button class="btn" data-a="mv" data-ei="${ei}" data-v="-1">Move up</button>`:''}${ei<S.active.ex.length-1?`<button class="btn" data-a="mv" data-ei="${ei}" data-v="1">Move down</button>`:''}<button class="btn danger" data-a="rmEx" data-ei="${ei}">Remove exercise</button></div>`);break;
 case 'mv':{const a=S.active.ex,j=ei+(+v);[a[ei],a[j]]=[a[j],a[ei]];save();closeSheet();render();break}
 case 'rmEx':S.active.ex.splice(ei,1);save();closeSheet();render();break;
 case 'exInfo':{const x=exObj(id);openSheet(`<h2>${h(x.n)}</h2><div class="mute sm"><span class="dot" style="background:${gc(x.g)}"></span>${h(x.m||x.g)}${x.e?`<br><span style="margin-left:17px">Equipment: ${h(x.e)}</span>`:''}</div>${regionsOf(id).length?`<div class="chips">${regionsOf(id).map(t=>`<button class="chip${t.pri?' on':''}" data-a="muscle" data-id="${t.r}">${h(regionById(t.r).n)}</button>`).join('')}</div><div class="mute sm" style="margin-top:6px">Tap a muscle for more exercises that train it.</div>`:''}${poseOf(id)?`<div class="demo"><svg viewBox="0 -14 200 204" width="100%" style="max-height:280px" role="img" aria-label="Animated demonstration"><g id="demoG">${drawFig(id,0)}</g></svg><div class="mute sm" id="demoLbl" style="text-align:center">Start position</div><div class="sm" style="text-align:center;margin-top:4px;color:#FF7A66">Red glow = muscle being worked</div></div>`:''}<a class="btn wide vid pri" href="${dbLink(id,x.n)}" target="_blank" rel="noopener">▶ ${DV[id]?'Watch Deltabolic’s video':'Find it on Deltabolic'}</a><a class="btn wide vid" href="${ytLink(x.n)}" target="_blank" rel="noopener" style="margin-top:8px;font-size:15px;padding:10px">Other form videos</a><div class="mute sm" style="text-align:center;margin-top:6px">YouTube, needs internet</div>${x.s?`<div class="sec">How to do it</div><ol class="g">${x.s.map(s=>`<li>${h(s)}</li>`).join('')}</ol>`:''}${x.t?`<div class="sec">Tips</div><ul class="g">${x.t.map(s=>`<li>${h(s)}</li>`).join('')}</ul>`:''}${S.active?(S.active.ex.some(e=>e.id===id)?'':`<button class="btn pri wide" data-a="pick" data-id="${h(id)}">Add to current workout</button>`):`<button class="btn pri wide" data-a="startWith" data-id="${h(id)}">Start a workout with this</button>`}`);if(poseOf(id))startDemo(id);break}
 case 'startWith':newWorkout('Workout');addEx(id);save();UI.tab='log';closeSheet();render();break;
 case 'picker':UI.pickMode=null;openPicker();break;
 case 'pgrp':UI.pgrp=v;document.querySelectorAll('#sheet .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));$('#plist').innerHTML=exList(UI.pq,UI.pgrp,'pick');break;
 case 'pick':pickInto(id);break;
 case 'addCustom':{const n=UI.pq.trim();const cid='c_'+uid();S.custom.push({id:cid,n,g:'Custom',m:'Custom exercise'});save();pickInto(cid);break}
 case 'finish':finish();break;
 case 'discard':ask('Discard workout?','Everything logged in this session will be lost.','Discard',()=>{S.active=null;save();restStop();render()},true);break;
 case 'restAdj':RT.end=Math.max(Date.now(),RT.end)+(+v)*1000;RT.total=Math.max(RT.total||0,(RT.end-Date.now())/1000);$('#rest').classList.remove('fin');$('#restLbl').textContent='Rest';tick();break;
 case 'restStop':restStop();break;
 case 'toggleH':if(e.target.closest('button'))break;UI.openH=UI.openH===id?null:id;render();break;
 case 'delW':ask('Delete workout?','This can’t be undone.','Delete',()=>{S.workouts=S.workouts.filter(w=>w.id!==id);save();render()},true);break;
 case 'gtab':UI.gtab=v;render();break;
 case 'grp':UI.grp=v;render();break;
 case 'unit':S.units=v;save();settings();render();break;
 case 'restSet':S.rest=+v;save();settings();break;
 case 'export':{try{const b=new Blob([backupText()],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='gym-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup downloaded')}catch(err){toast('Download blocked – use Copy instead')}break}
 case 'copyExport':{const t=backupText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Backup copied – paste it into a note')).catch(()=>openSheet(`<h2>Backup text</h2><p class="mute sm">Select all and copy it into a note or email to yourself.</p><textarea readonly>${h(t)}</textarea>`));break}
 case 'pasteImport':openSheet(`<h2>Paste backup</h2><textarea id="pasteBox" placeholder="Paste backup text here"></textarea><button class="btn pri wide" data-a="doPaste">Import</button>`);break;
 case 'doPaste':doImport($('#pasteBox').value);break;
 case 'muscle':muscleSheet(id);break;
 case 'muscleWorkout':muscleWorkout(id);break;
 case 'restDone':S.lastProg={pid:el.dataset.t,di:+el.dataset.d};save();closeSheet();render();toast('Rest day done. Next session is ready.');break;
 case 'calM':UI.calM=Math.min(0,(UI.calM||0)+(+v));render();break;
 case 'pref':S.prefs[el.dataset.k]=el.dataset.k==='days'?+v:v;save();render();break;
 case 'addBuiltin':{const d=defaultPrograms().find(x=>x.id===v);if(S.programs.some(x=>x.id===d.id))d.id='p_'+uid();S.programs.push(d);save();render();toast('Program added');break}
 case 'progEdit':{const pr=S.programs.find(x=>x.id===id);if(!pr)break;UI.edit=clone(pr);openEditor();$('#sheet').scrollTop=0;break}
 case 'progNew':UI.edit={id:'p_'+uid(),name:'My program',desc:'',days:[{name:'Day 1',items:[]}],_new:1};openEditor();$('#sheet').scrollTop=0;break;
 case 'dayAdd':UI.edit.days.push({name:'Day '+(UI.edit.days.length+1),items:[]});openEditor(99999);break;
 case 'dayDel':UI.edit.days.splice(+el.dataset.di,1);openEditor(true);break;
 case 'itUp':{const it=UI.edit.days[+el.dataset.di].items,i=+el.dataset.ii;[it[i-1],it[i]]=[it[i],it[i-1]];openEditor(true);break}
 case 'itDel':UI.edit.days[+el.dataset.di].items.splice(+el.dataset.ii,1);openEditor(true);break;
 case 'itAdd':UI.pickMode={di:+el.dataset.di,sc:$('#sheet').scrollTop};openPicker();break;
 case 'pickBack':{const sc=UI.pickMode?UI.pickMode.sc:0;UI.pickMode=null;openEditor(sc);break}
 case 'progSave':{const p=UI.edit;p.name=(p.name||'').trim()||'My program';
  if(!p.days.length){toast('Add at least one day');break}
  p.days.forEach((d,i)=>{d.name=(d.name||'').trim()||('Day '+(i+1));d.items.forEach(it=>{it.s=Math.max(1,Math.round(num(it.s))||3);it.r=Math.max(1,Math.round(num(it.r))||10)})});
  const isNew=p._new;delete p._new;const i=S.programs.findIndex(x=>x.id===p.id);if(i>=0)S.programs[i]=p;else S.programs.push(p);
  UI.edit=null;save();closeSheet();render();toast(isNew?'Program created':'Program saved');break}
 case 'progDup':{const c=clone(UI.edit);c.id='p_'+uid();c.name=(c.name||'Program')+' (copy)';delete c.builtin;delete c._new;S.programs.push(c);save();UI.edit=clone(c);openEditor();$('#sheet').scrollTop=0;render();toast('Copy created – now editing the copy');break}
 case 'progDel':{const pid=UI.edit.id,nm=UI.edit.name;ask('Delete program?',`“${nm}” will be removed. Your workout history stays.`,'Delete',()=>{S.programs=S.programs.filter(x=>x.id!==pid);UI.edit=null;save();render();toast('Program deleted')},true);break}
 case 'progReset':ask('Restore built-in programs?','The three built-in programs go back to their original version (adding any you deleted). Programs you created stay as they are.','Restore',()=>{defaultPrograms().forEach(d=>{const i=S.programs.findIndex(x=>x.builtin===d.builtin);if(i>=0){d.id=S.programs[i].id;S.programs[i]=d}else{if(S.programs.some(x=>x.id===d.id))d.id='p_'+uid();S.programs.push(d)}});save();render();toast('Built-in programs restored')});break;
 case 'install':if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;closeSheet()})}break;
 case 'wipe':ask('Delete all data?','All workouts and settings on this device will be erased. Export a backup first if you might want them.','Delete everything',()=>{S={units:S.units,rest:S.rest,workouts:[],active:null,custom:[]};fixState();save();restStop();render();toast('All data deleted')},true);break;
 }
});
document.addEventListener('input',e=>{
 const f=e.target.dataset.f;if(!f)return;const t=e.target;
 if(f==='w'||f==='r'){S.active.ex[+t.dataset.ei].sets[+t.dataset.si][f]=t.value;save()}
 else if(f==='wname'){S.active.name=t.value;save()}
 else if(f==='bw'){const v=num(t.value);if(v>20&&v<400){S.bw=v;save()}}
 else if(f==='pname'&&UI.edit)UI.edit.name=t.value;
 else if(f==='pdesc'&&UI.edit)UI.edit.desc=t.value;
 else if(f==='dname'&&UI.edit)UI.edit.days[+t.dataset.di].name=t.value;
 else if((f==='is'||f==='ir')&&UI.edit)UI.edit.days[+t.dataset.di].items[+t.dataset.ii][f==='is'?'s':'r']=t.value;
 else if(f==='q'){UI.q=t.value;$('#exlist').innerHTML=exList(UI.q,UI.grp,'exInfo')}
 else if(f==='pq'){UI.pq=t.value;$('#plist').innerHTML=exList(UI.pq,UI.pgrp,'pick')}
});
document.addEventListener('change',e=>{
 const f=e.target.dataset.f;
 if(f==='progEx'){UI.progEx=e.target.value;render()}
 if(f==='importFile'){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(file)}
});
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('App installed')});
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
 navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Update downloaded. Reopen the app to use it.')})})}).catch(()=>{});
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
render();
</script>
